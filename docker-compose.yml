version: '3.8'

# ============================================================
# AI Agent Stack
# Services:
#   - db             : MySQL 8.0
#   - redis          : Redis 7 (cache + queues)
#   - phpmyadmin     : phpMyAdmin (port 8082)
#   - backend        : Laravel 11 PHP-FPM
#   - queue          : Laravel queue:work (health-checks)
#   - nginx-backend  : Nginx reverse proxy for Laravel (port 8000)
#   - frontend       : React/Vite (ai-agent-wp) served by Nginx (port 3000)
#   - mailpit        : Local SMTP catcher (port 8025)
#   - wordpress      : WordPress site (port 8063 / 8443)
# ============================================================

services:

  # ─── MySQL 8 Database ────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: ai_agent_db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: "Asia/Kolkata"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    networks:
      - wpsite
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis 7 (Cache + Queues) ─────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ai_agent_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - wpsite
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── phpMyAdmin ───────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: ai_agent_phpmyadmin
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "8082:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      PMA_ABSOLUTE_URI: http://localhost:8082/
      UPLOAD_LIMIT: 100M
    volumes:
      - ./uploads.ini:/usr/local/etc/php/conf.d/php-phpmyadmin.ini
    networks:
      - wpsite

  # ─── Laravel 11 Backend (PHP-FPM) ────────────────────────
  backend:
    build:
      context: ./ai-agent/ai-agent-backend
      dockerfile: Dockerfile
    container_name: ai_agent_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Wait until PHP-FPM is actually listening on port 9000.
      # nc (netcat) is available in the alpine base image.
      test: [ "CMD-SHELL", "nc -z localhost 9000 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 12 # allow up to ~2 min for migrations to finish
      start_period: 30s # don't start counting until 30s after container start
    environment:
      APP_NAME: "AI Agent Backend"
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8000}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: ${SESSION_DRIVER:-database}
      LOG_CHANNEL: stderr
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      TZ: Asia/Kolkata
    volumes:
      - backend_storage:/var/www/html/storage
      - backend_cache:/var/www/html/bootstrap/cache
      - backend_public:/var/www/html/public
    networks:
      - wpsite

  # ─── Laravel Queue Worker ─────────────────────────────────
  queue:
    image: ai_agent-backend:latest
    container_name: ai_agent_queue
    restart: unless-stopped
    command: [ "php", "artisan", "queue:work", "--queue=health-checks,default", "--sleep=3", "--tries=3", "--timeout=120" ]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      APP_NAME: "AI Agent Backend"
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-true}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_DRIVER: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      LOG_CHANNEL: stderr
      TZ: Asia/Kolkata
    volumes:
      - backend_storage:/var/www/html/storage
      - backend_cache:/var/www/html/bootstrap/cache
    networks:
      - wpsite

  # ─── Mailpit (Local SMTP) ─────────────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    container_name: ai_agent_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025" # Web UI
      - "1025:1025" # SMTP
    networks:
      - wpsite

  # ─── Nginx for Laravel Backend ────────────────────────────
  nginx-backend:
    image: nginx:1.25-alpine
    container_name: ai_agent_nginx_backend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy # wait for PHP-FPM to be ready
    ports:
      - "8000:80"
    volumes:
      - backend_public:/var/www/html/public:ro
      - ./ai-agent/ai-agent-backend/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - wpsite

  # ─── React Frontend (ai-agent-wp) ─────────────────────────
  frontend:
    build:
      context: ./ai-agent/ai-agent-wp
      dockerfile: Dockerfile
    container_name: ai_agent_frontend
    restart: on-failure
    ports:
      - "3000:80"
    networks:
      - wpsite

  # ─── WordPress ────────────────────────────────────────────
  wordpress:
    image: wordpress:latest
    container_name: ai_agent_wordpress
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "8063:80"
      - "8443:443"
    volumes:
      - ./:/var/www/html
      - ./uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
    networks:
      - wpsite

# ─── Networks ─────────────────────────────────────────────
networks:
  wpsite:
    driver: bridge

# ─── Volumes ──────────────────────────────────────────────
volumes:
  db_data:
    driver: local
  redis_data:
    driver: local
  backend_storage:
    driver: local
  backend_cache:
    driver: local
  backend_public:
    driver: local

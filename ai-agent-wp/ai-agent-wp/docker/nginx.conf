server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # React Router: serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy GraphQL calls to Laravel backend (used by the React UI).
    # We use a variable for the upstream and the Docker embedded resolver
    # (127.0.0.11) so nginx re-resolves the hostname on every request
    # instead of caching the DNS result at startup. This prevents 502s
    # when the frontend container starts before nginx-backend is ready.
    location /graphql {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://nginx-backend:80;
        proxy_pass $backend/graphql;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_connect_timeout 10s;
    }

    # Proxy API calls to Laravel backend
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://nginx-backend:80;
        proxy_pass $backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_connect_timeout 10s;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}

name: Deploy Frontend → wp-auditor.webdezign.uk

on:
  push:
    branches: [main, development]
    paths:
      - 'ai-agent-wp/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy React/Vite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ai-agent-wp/package-lock.json

      - name: Install dependencies
        working-directory: ai-agent-wp
        run: npm ci

      - name: Build production bundle
        working-directory: ai-agent-wp
        env:
          VITE_API_URL: https://api.wp-auditor.webdezign.uk/graphql
        run: npm run build

      - name: Copy .htaccess into dist
        run: cp ai-agent-wp/public/.htaccess ai-agent-wp/dist/.htaccess

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p 22 svr01.webdezign.co.uk >> ~/.ssh/known_hosts

      - name: Package & upload
        run: |
          tar -czf /tmp/frontend.tar.gz -C ai-agent-wp/dist .
          scp -P 22 -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no \
            /tmp/frontend.tar.gz \
            webdezignuk@svr01.webdezign.co.uk:/home/webdezignuk/frontend.tar.gz

      - name: Extract on server
        run: |
          ssh -p 22 -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no \
            webdezignuk@svr01.webdezign.co.uk << 'ENDSSH'
            set -e
            DEPLOY=/home/webdezignuk/wp-auditor.webdezign.uk
            mkdir -p $DEPLOY
            # Remove old files, extract new
            find $DEPLOY -mindepth 1 -delete 2>/dev/null || true
            tar -xzf /home/webdezignuk/frontend.tar.gz -C $DEPLOY
            rm /home/webdezignuk/frontend.tar.gz
            echo "Frontend extracted to $DEPLOY"
          ENDSSH

      - name: Done
        run: echo "✅ Frontend deployed to https://wp-auditor.webdezign.uk"

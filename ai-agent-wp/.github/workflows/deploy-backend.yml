name: Deploy Backend → api.wp-auditor.webdezign.uk

on:
  push:
    branches: [main, development]
    paths:
      - 'ai-agent-backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy Laravel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, openssl, pdo, pdo_mysql, tokenizer, xml, ctype, json, bcmath, curl
          tools: composer:v2

      - name: Install Composer dependencies
        working-directory: ai-agent-backend
        run: |
          mkdir -p bootstrap/cache storage/framework/{sessions,views,cache} storage/logs
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Create .env
        working-directory: ai-agent-backend
        run: |
          cat > .env << EOF
          APP_NAME="WP Auditor"
          APP_ENV=production
          APP_KEY=${{ secrets.APP_KEY }}
          APP_DEBUG=false
          APP_URL=https://api.wp-auditor.webdezign.uk

          LOG_CHANNEL=single
          LOG_LEVEL=error

          DB_CONNECTION=mysql
          DB_HOST=localhost
          DB_PORT=3306
          DB_DATABASE=${{ secrets.DB_DATABASE }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}

          CACHE_DRIVER=file
          QUEUE_CONNECTION=sync
          SESSION_DRIVER=file
          SESSION_LIFETIME=120
          FILESYSTEM_DISK=local

          MAIL_MAILER=smtp
          MAIL_HOST=mail.webdezign.uk
          MAIL_PORT=587
          MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
          MAIL_ENCRYPTION=tls
          MAIL_FROM_ADDRESS=${{ secrets.MAIL_FROM_ADDRESS }}
          MAIL_FROM_NAME="WP Auditor"

          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL=gpt-4o

          SANCTUM_STATEFUL_DOMAINS=wp-auditor.webdezign.uk
          CORS_ALLOWED_ORIGINS=https://wp-auditor.webdezign.uk
          EOF

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p 22 svr01.webdezign.co.uk >> ~/.ssh/known_hosts

      - name: Package & upload
        run: |
          # Create archive excluding git, tests, docker files
          tar -czf /tmp/backend.tar.gz \
            --exclude='ai-agent-backend/.git' \
            --exclude='ai-agent-backend/.github' \
            --exclude='ai-agent-backend/node_modules' \
            --exclude='ai-agent-backend/storage/logs/*.log' \
            --exclude='ai-agent-backend/storage/framework/cache' \
            --exclude='ai-agent-backend/storage/framework/sessions' \
            --exclude='ai-agent-backend/storage/framework/views' \
            ai-agent-backend/

          # Upload to server
          scp -P 22 -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no \
            /tmp/backend.tar.gz \
            webdezignuk@svr01.webdezign.co.uk:/home/webdezignuk/backend.tar.gz

      - name: Extract & run post-deploy
        run: |
          ssh -p 22 -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no \
            webdezignuk@svr01.webdezign.co.uk << 'ENDSSH'
            set -e
            PHP=/opt/cpanel/ea-php83/root/usr/bin/php
            DEPLOY=/home/webdezignuk/api.wp-auditor.webdezign.uk

            # Extract (strip the ai-agent-backend/ prefix)
            tar -xzf /home/webdezignuk/backend.tar.gz \
              --strip-components=1 \
              -C $DEPLOY
            rm /home/webdezignuk/backend.tar.gz

            # Ensure dirs and permissions
            mkdir -p $DEPLOY/storage/framework/{sessions,views,cache}
            mkdir -p $DEPLOY/storage/logs $DEPLOY/bootstrap/cache
            chmod -R 755 $DEPLOY/storage $DEPLOY/bootstrap/cache

            # Artisan commands
            cd $DEPLOY
            mkdir -p resources/views
            $PHP artisan config:cache
            $PHP artisan route:cache
            $PHP artisan migrate --force
          ENDSSH

      - name: Done
        run: echo "✅ Backend deployed to https://api.wp-auditor.webdezign.uk"
